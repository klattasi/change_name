; PlatformIO Project Configuration File — BATT_01
; PZEM-017 DC Meter via RS485 Modbus | WiFi AP | BLE | SPIFFS WebServer

[env:esp32doit-devkit-v1]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino

; ── Serial monitor ──────────────────────────────────────────────────────────
monitor_speed = 115200

; ── SPIFFS filesystem ────────────────────────────────────────────────────────
board_build.filesystem = spiffs

; ── Partition: huge_app (3 MB app + 1 MB SPIFFS) ────────────────────────────
; Required because BLE + WiFi + AsyncWebServer combined binary > 1.2 MB
board_build.partitions = huge_app.csv

; ── Libraries ────────────────────────────────────────────────────────────────
lib_deps =
    4-20ma/ModbusMaster @ ^2.0.1
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.1.0
